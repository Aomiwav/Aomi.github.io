<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire du sang</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
:root{--cover:#1b0c0d;--ink:#2a1a14;--muted:#6b5445;--blood:#8a1c26;--line:#b9a47a;--sel:#d8c59a;--gold:#b8963e}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 20%,#3a1a1c 0,var(--cover) 70%) fixed;color:var(--ink);font-family:"IM Fell English",Georgia,serif;font-size:1.1rem;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 50px}
header{text-align:center;margin-bottom:26px}
h1{font-weight:400;font-size:clamp(2.2rem,7vw,3.8rem);color:#e3c981;margin:0;letter-spacing:.04em;text-shadow:0 2px 0 #000,0 0 18px rgba(184,150,62,.35)}
.sub{color:#b9a58c;margin:4px 0 0;font-style:italic}
.orn{text-align:center;color:var(--gold);font-size:1.5rem;line-height:1;margin:4px 0 10px}
.orn::before,.orn::after{content:"";display:inline-block;width:34%;max-width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);vertical-align:middle;margin:0 10px}
.book{position:relative;display:grid;grid-template-columns:290px 1fr;border:13px solid #3b1d1f;border-radius:8px;box-shadow:0 0 0 2px #0e0506,0 22px 50px rgba(0,0,0,.7),inset 0 0 0 2px #0e0506;min-height:520px}
.book::before{content:"";position:absolute;inset:-8px;border:1px dashed var(--gold);border-radius:5px;pointer-events:none;opacity:.8}
.ribbon{position:absolute;top:-14px;right:56px;width:26px;height:84px;background:linear-gradient(90deg,#6e1119,#a3202c 50%,#6e1119);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:2}
.index,.entry{background:radial-gradient(ellipse at 50% 45%,#ecdfc0 35%,#d9c79c 80%,#c9b283 100%)}
.index{padding:16px 0;box-shadow:inset -22px 0 26px -14px rgba(70,35,20,.55)}
.entry{padding:30px 34px 34px 40px;box-shadow:inset 22px 0 26px -14px rgba(70,35,20,.55);min-height:480px}
.idx{font-weight:400;font-size:1.5rem;text-align:center;margin:0;color:var(--blood)}
.filters{padding:0 16px 12px;display:grid;gap:8px}
select,input,textarea{width:100%;font:inherit;font-size:1rem;padding:6px 8px;background:rgba(255,250,235,.45);border:1px solid var(--line);color:var(--ink);border-radius:2px}
input[type=color]{padding:2px;height:34px}
.list{list-style:none;margin:0;padding:0}
.list button{all:unset;display:block;width:100%;box-sizing:border-box;padding:8px 16px;cursor:pointer;border-left:4px solid transparent}
.list button:hover{background:rgba(138,28,38,.1)}
.list button:focus-visible{outline:2px solid var(--blood);outline-offset:-2px}
.list button[aria-current="true"]{background:rgba(138,28,38,.14);border-left-color:var(--blood)}
.list b{display:block;font-weight:400;font-size:1.2rem}
.list span{font-size:.9rem;color:var(--muted);font-style:italic}
.none{padding:8px 16px;color:var(--muted)}
.entry h2{font-weight:400;font-size:2.4rem;margin:0;color:var(--blood);line-height:1.15}
.race{margin:0 0 16px;color:var(--muted);font-style:italic;text-align:center}
.seal{float:right;position:relative;width:56px;height:56px;margin:0 0 8px 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--c),#2a0a0d 96%);box-shadow:0 3px 5px rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.18)}
.seal::after{content:"";position:absolute;left:20px;top:19px;width:16px;height:16px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:rgba(255,255,255,.28)}
dl{display:grid;grid-template-columns:130px 1fr;gap:0 14px;margin:0}
dt,dd{margin:0;padding:6px 0;border-bottom:1px dotted var(--line)}
dt{color:var(--muted);font-style:italic}
.bar{display:inline-block;width:120px;height:8px;background:var(--line);border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blood)}
.note{margin-top:22px;max-width:60ch}
.note::first-letter{float:left;font-size:3.2rem;line-height:.9;padding:4px 8px 0 0;color:var(--blood)}
.drop{display:inline-block;width:14px;height:14px;background:var(--c);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.btn{font:inherit;font-size:1rem;cursor:pointer;padding:7px 14px;border:1px solid var(--blood);background:var(--blood);color:#f3e8d4;border-radius:2px;display:inline-block;text-decoration:none}
.btn.alt{background:transparent;color:var(--blood)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;clear:both;margin-top:22px}
.admin{margin:0 16px 12px;display:grid;gap:8px}
.admin p{margin:0;font-size:.85rem;color:var(--muted)}
form{display:grid;gap:10px;max-width:520px;clear:both}
label{display:grid;gap:2px;color:var(--muted);font-size:.95rem}
@media (max-width:760px){.book{grid-template-columns:1fr}.index{box-shadow:inset 0 -18px 22px -14px rgba(70,35,20,.5)}.entry{padding:22px 18px;box-shadow:none}dl{grid-template-columns:100px 1fr}}
@media (prefers-reduced-motion:no-preference){.entry{animation:turn .35s ease-out}@keyframes turn{from{opacity:.4;transform:translateX(10px)}to{opacity:1;transform:none}}}

/* --- look ancien --- */
:root{--ink:#2b1c12;--muted:#645036;--line:#a8905f}
h1,.idx,.entry h2{font-family:"Uncial Antiqua","IM Fell English",Georgia,serif;letter-spacing:.02em}
h1{font-size:clamp(1.9rem,6vw,3.2rem)}
.idx{font-size:1.25rem}
.entry h2{font-size:1.9rem}
.note::first-letter{font-family:"Uncial Antiqua","IM Fell English",serif;font-size:2.8rem}
.index,.entry{background:
radial-gradient(circle at 16% 20%,rgba(120,70,30,.30) 0,transparent 9%),
radial-gradient(circle at 84% 72%,rgba(110,60,25,.24) 0,transparent 13%),
radial-gradient(circle at 62% 10%,rgba(95,30,25,.20) 0,transparent 6%),
radial-gradient(circle at 30% 88%,rgba(80,45,20,.22) 0,transparent 8%),
url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .6 -.2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"),
radial-gradient(ellipse at 50% 45%,#e0cc9a 28%,#cbb077 76%,#a4854d 100%)}
.index{box-shadow:inset -22px 0 26px -14px rgba(60,30,15,.65),inset 0 0 46px rgba(70,35,10,.6)}
.entry{box-shadow:inset 22px 0 26px -14px rgba(60,30,15,.65),inset 0 0 46px rgba(70,35,10,.6)}
.list span,.race,dt{color:var(--muted)}
select,input,textarea{background:rgba(120,85,40,.12)}
.book{border-color:#2e1618}
@media (max-width:760px){.index{box-shadow:inset 0 0 46px rgba(70,35,10,.6)}.entry{box-shadow:inset 0 0 46px rgba(70,35,10,.6)}}
.ribbon{right:112px}
#tok{margin-top:2px}
[hidden]{display:none!important}
.list em.sp{display:block;font-size:.88rem;color:var(--muted);line-height:1.3}

/* --- goutte scotchée + profondeur --- */
.seal{width:54px;height:72px;border-radius:0;background:none;box-shadow:none;margin:0 0 8px 12px;transform:rotate(5deg);filter:drop-shadow(1px 4px 3px rgba(40,10,5,.5))}
.seal::after{display:none}
.seal svg{display:block}
.tape{position:absolute;top:-5px;left:50%;width:44px;height:17px;margin-left:-22px;transform:rotate(-7deg);background:linear-gradient(180deg,rgba(240,230,190,.72),rgba(215,200,150,.62));box-shadow:0 1px 2px rgba(0,0,0,.3);clip-path:polygon(0 8%,3% 0,6% 10%,9% 0,100% 0,97% 30%,100% 55%,97% 80%,100% 100%,6% 100%,3% 88%,0 100%,2% 60%,0 30%);z-index:1}
.book{box-shadow:0 0 0 2px #0e0506,0 3px 0 -1px #cdb887,0 5px 0 -2px #2e1618,0 7px 0 -3px #cdb887,0 9px 0 -4px #2e1618,0 34px 50px rgba(0,0,0,.8),inset 0 0 0 2px #0e0506}
.index,.entry{position:relative}
.index::after,.entry::before{content:"";position:absolute;top:0;bottom:0;width:34px;pointer-events:none}
.index::after{right:0;background:linear-gradient(270deg,rgba(35,15,5,.6),rgba(35,15,5,.18) 45%,transparent)}
.entry::before{left:0;background:linear-gradient(90deg,rgba(35,15,5,.6),rgba(35,15,5,.18) 45%,transparent)}
.entry>*{position:relative}
@media (max-width:760px){.index::after{display:none}.entry::before{display:none}}

/* --- tranche des pages (gauche et droite) --- */
.book{isolation:isolate;border-radius:10px 6px 6px 10px}
.book::after{content:"";position:absolute;inset:-5px -29px -9px -29px;z-index:-1;pointer-events:none;border-radius:6px 4px 4px 6px;
background:
linear-gradient(270deg,rgba(40,20,5,.55),transparent 70%) right/14px 100% no-repeat,
linear-gradient(90deg,rgba(40,20,5,.55),transparent 70%) left/14px 100% no-repeat,
repeating-linear-gradient(90deg,#eadbb0 0 1px,#b9a572 1px 2px) right/14px 100% no-repeat,
repeating-linear-gradient(90deg,#b9a572 0 1px,#eadbb0 1px 2px) left/14px 100% no-repeat}
@media (max-width:760px){.book::after{display:none}}

/* --- dos en cuir à gauche, tranche des pages à droite --- */
.book::after{display:none}
.wrap{padding-left:40px;padding-right:40px}
.spine{position:absolute;top:-5px;bottom:-9px;left:-38px;width:30px;border-radius:20px 0 0 20px;z-index:-1;
background:linear-gradient(90deg,#100607 0,#4b2628 30%,#5d3133 47%,#37191b 74%,#1b0c0d 100%);
box-shadow:-5px 8px 16px rgba(0,0,0,.65),inset 0 0 0 1px rgba(0,0,0,.45)}
.spine::before,.spine::after{content:"";position:absolute;left:4px;right:4px;height:14px;border-top:2px solid rgba(184,150,62,.85);border-bottom:2px solid rgba(184,150,62,.85)}
.spine::before{top:13%}
.spine::after{bottom:13%}
.edge{position:absolute;top:3px;bottom:-5px;right:-29px;width:16px;z-index:-1;border-radius:0 4px 4px 0;
background:linear-gradient(270deg,rgba(40,20,5,.6),transparent 65%),repeating-linear-gradient(90deg,#eadbb0 0 1px,#b9a572 1px 2px);
box-shadow:inset 0 3px 0 #2e1618,inset 0 -3px 0 #2e1618,4px 6px 12px rgba(0,0,0,.5)}
@media (max-width:760px){.spine,.edge{display:none}.wrap{padding-left:18px;padding-right:18px}}

/* --- cuir sombre taché, façon vieux grimoire --- */
:root{--lth:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .08 0 0 0 0 .05 0 0 0 0 .03 0 1.2 0 0 -.3'/></filter><rect width='200' height='200' filter='url(%23c)'/></svg>"),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><filter id='a'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='4' seed='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .07 0 0 0 0 .04 0 0 0 0 .03 -2.2 0 0 0 1.2'/></filter><rect width='500' height='500' filter='url(%23a)'/></svg>"),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.016' numOctaves='4' seed='8' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .33 0 0 0 0 .24 2.4 0 0 0 -1.25'/></filter><rect width='500' height='500' filter='url(%23b)'/></svg>")}
.book{border-color:transparent;background-color:#2e211a;
background-image:radial-gradient(circle at 0 0,rgba(150,120,90,.5),transparent 48px),radial-gradient(circle at 100% 0,rgba(150,120,90,.5),transparent 48px),radial-gradient(circle at 0 100%,rgba(150,120,90,.5),transparent 48px),radial-gradient(circle at 100% 100%,rgba(150,120,90,.5),transparent 48px),var(--lth)}
.book::before{border-color:rgba(205,175,125,.35)}
.spine{background-color:#2e211a;
background-image:linear-gradient(90deg,rgba(0,0,0,.6),rgba(255,225,180,.14) 45%,rgba(0,0,0,.55)),radial-gradient(circle at 50% 50%,#0d0606 0 7px,rgba(200,165,100,.7) 7px 8px,transparent 8px),var(--lth)}
.spine::before,.spine::after{border-color:rgba(200,165,100,.5)}

/* --- éclaboussure de sang + scotch au milieu --- */
.seal{width:104px;height:104px;margin:-6px 0 6px 10px;transform:rotate(4deg);filter:drop-shadow(0 2px 2px rgba(30,5,5,.35))}
.seal svg{display:block;width:104px;height:104px}
.tape{top:50%;margin-top:-9px;width:64px;height:18px;margin-left:-32px;transform:rotate(-9deg)}

/* --- sang pris sous un morceau de scotch collé sur la page --- */
.seal{width:132px;height:92px;margin:-2px 0 10px 14px;transform:rotate(-5deg);filter:drop-shadow(1px 3px 2px rgba(35,20,8,.5))}
.tp{position:absolute;inset:0;overflow:hidden;background:rgba(236,224,178,.42);
clip-path:polygon(3% 0,97% 0,100% 8%,97% 16%,100% 25%,97% 34%,100% 43%,97% 52%,100% 61%,97% 70%,100% 79%,97% 88%,100% 100%,3% 100%,0 92%,3% 84%,0 75%,3% 66%,0 57%,3% 48%,0 39%,3% 30%,0 21%,3% 12%)}
.tp svg{position:absolute;display:block;width:190px;height:190px;left:-18px;top:-55px;opacity:.93}
.tp::after{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(115deg,rgba(255,255,255,.42) 0,rgba(255,255,255,0) 26%,rgba(255,255,255,.2) 50%,rgba(255,255,255,0) 68%),linear-gradient(180deg,rgba(255,255,255,.3),transparent 16%,transparent 84%,rgba(70,45,10,.22))}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Grimoire du sang</h1><p class="sub">Registre des sangs connus : goût, groupe, effets.</p></header>
<div class="book">
<div class="ribbon" aria-hidden="true"></div>
<div class="spine" aria-hidden="true"></div><div class="edge" aria-hidden="true"></div>
<nav class="index" aria-label="Index">
<h2 class="idx">Table des sangs</h2><div class="orn" aria-hidden="true">❦</div>
<div class="admin" id="admin" hidden>
<div class="admin" id="login" style="margin:0">
<input id="tok" type="password" placeholder="Jeton GitHub" aria-label="Jeton GitHub" autocomplete="off">
<button class="btn" id="conn">Se connecter</button>
</div>
<div class="admin" id="tools" style="margin:0" hidden>
<button class="btn" id="addBtn">Ajouter un sang</button>
<a class="btn alt" id="dl" href="#">Télécharger data.js</a>
<button class="btn alt" id="reset">Annuler mes changements</button>
<button class="btn" id="pub">Publier sur GitHub</button>
<button class="btn alt" id="out">Se déconnecter</button>
</div>
<p id="pubmsg" role="status"></p>
</div>
<div class="filters">
<input id="q" type="search" placeholder="Chercher un nom" aria-label="Chercher un nom">
<select id="g" aria-label="Groupe sanguin"><option value="">Tous les groupes</option></select>
<select id="r" aria-label="Rareté"><option value="">Toutes les raretés</option></select>
</div>
<ul class="list" id="list"></ul>
</nav>
<article class="entry" id="entry" aria-live="polite"></article>
</div>
</div>

var KEY="grimoire-brouillon",$=function(i){return document.getElementById(i)};
var CLE="#edit",UNLOCKED=false,TOKEN="",EDIT=location.hash===CLE,entries=(window.GRIMOIRE||[]).slice(),cur=null,editing=null,confirmDel=false;

function save(){if(!UNLOCKED)return;try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function sorted(){return entries.slice().sort(function(a,b){return String(a.n).localeCompare(String(b.n),"fr")})}
function fillSel(sel,key,label){var keep=sel.value,v=[];entries.forEach(function(x){if(x[key]&&v.indexOf(x[key])<0)v.push(x[key])});v.sort();sel.innerHTML="<option value=''>"+label+"</option>"+v.map(function(x){return "<option>"+esc(x)+"</option>"}).join("");sel.value=v.indexOf(keep)<0?"":keep}
function dataText(){return "// Les fiches du grimoire. Remplace ce fichier sur ton hébergement pour publier.\nwindow.GRIMOIRE = "+JSON.stringify(entries,null,1)+";\n"}
function exportLink(){var t=dataText();
$("dl").href="data:text/javascript;charset=utf-8,"+encodeURIComponent(t);$("dl").download="data.js"}
function render(){fillSel($("g"),"g","Tous les groupes");fillSel($("r"),"r","Toutes les raretés");
$("admin").hidden=!EDIT;$("login").hidden=UNLOCKED;$("tools").hidden=!UNLOCKED;if(UNLOCKED)exportLink();
var q=$("q").value.toLowerCase(),g=$("g").value,r=$("r").value,ul=$("list"),n=0;ul.innerHTML="";
sorted().forEach(function(x){if((q&&String(x.n).toLowerCase().indexOf(q)<0)||(g&&x.g!==g)||(r&&x.r!==r))return;n++;
var li=document.createElement("li"),b=document.createElement("button");b.innerHTML="<b>"+esc(x.n)+"</b>"+(x.e?"<em class='sp'>"+esc(x.e)+"</em>":"")+"<span>"+esc(x.g)+" · "+esc(x.r)+"</span>";
if(x.id===cur)b.setAttribute("aria-current","true");b.onclick=function(){cur=x.id;editing=null;confirmDel=false;render()};li.appendChild(b);ul.appendChild(li)});
if(!n)ul.innerHTML="<li class='none'>"+(entries.length?"Aucun sang ne correspond. Change un filtre.":"Le grimoire est vide.")+"</li>";
if(editing!==null)return form();
var x=entries.filter(function(e){return e.id===cur})[0];
if(!x){$("entry").innerHTML="<p class='race'>"+(entries.length?"Choisis un sang dans l’index.":"Aucun sang n’a encore été ajouté.")+"</p>";return}
var s=Math.max(0,Math.min(10,Number(x.s)||0)),cc=/^#[0-9a-f]{6}$/i.test(x.c)?x.c:"#7a1a1f";
$("entry").innerHTML="<span class='seal' style='--c:"+cc+"' aria-hidden='true'><span class='tp'>"+SPLAT+"</span></span><h2>"+esc(x.n)+"</h2><div class='orn' aria-hidden='true'>❦</div><p class='race'>"+esc(x.e)+"</p><dl><dt>Groupe</dt><dd>"+esc(x.g)+"</dd><dt>Rareté</dt><dd>"+esc(x.r)+"</dd><dt>Couleur</dt><dd><span class='drop' style='--c:"+esc(/^#[0-9a-f]{6}$/i.test(x.c)?x.c:"#7a1a1f")+"'></span></dd><dt>Odeur</dt><dd>"+esc(x.o)+"</dd><dt>Goût</dt><dd>"+esc(x.t)+"</dd><dt>Note de goût</dt><dd><span class='bar'><i style='width:"+s*10+"%'></i></span>"+s+" / 10</dd><dt>Effets</dt><dd>"+esc(x.f)+"</dd><dt>Dangers</dt><dd>"+esc(x.d)+"</dd></dl><p class='note'>"+esc(x.no)+"</p>"+(UNLOCKED?"<div class='actions'><button class='btn alt' id='ed'>Modifier</button><button class='btn alt' id='del'>"+(confirmDel?"Confirmer la suppression":"Supprimer")+"</button></div>":"");
if($("ed"))$("ed").onclick=function(){editing=x.id;render()};
if($("del"))$("del").onclick=function(){if(!confirmDel){confirmDel=true;render();return}
entries=entries.filter(function(e){return e.id!==x.id});cur=null;confirmDel=false;save();render()}}
function slug(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"sang"}
function form(){var x=entries.filter(function(e){return e.id===editing})[0]||{s:5,c:"#7a1a1f"};
var h="<h2>"+(x.id?"Modifier un sang":"Nouveau sang")+"</h2><form id='f'>";
FIELDS.forEach(function(f){var k=f[0],t=f[2];h+="<label>"+f[1]+(t==="select"?"<select name='"+k+"'>"+OPTS[k].map(function(o){return "<option>"+o+"</option>"}).join("")+"</select>":t==="area"?"<textarea name='"+k+"' rows='3'></textarea>":"<input name='"+k+"' type='"+(t||"text")+"'"+(k==="n"?" required":"")+">")+"</label>"});
h+="<div class='actions'><button class='btn' type='submit'>Enregistrer</button><button class='btn alt' type='button' id='cx'>Annuler</button></div></form>";
$("entry").innerHTML=h;var f=$("f");
FIELDS.forEach(function(fl){var el=f.elements[fl[0]],v=x[fl[0]]==null?"":String(x[fl[0]]);if(fl[2]==="select"&&v!==""&&OPTS[fl[0]].indexOf(v)<0)el.add(new Option(v,v));el.value=v});
$("cx").onclick=function(){editing=null;render()};
f.onsubmit=function(ev){ev.preventDefault();var o={id:x.id};FIELDS.forEach(function(fl){var v=f.elements[fl[0]].value.trim();o[fl[0]]=fl[0]==="s"?Math.max(0,Math.min(10,Number(v)||0)):v});
if(x.id){entries=entries.map(function(e){return e.id===x.id?o:e})}else{var id=slug(o.n),b=id,i=2;while(entries.some(function(e){return e.id===id}))id=b+"-"+i++;o.id=id;entries.push(o)}
cur=o.id;editing=null;save();render()}}
["q","g","r"].forEach(function(i){$(i).oninput=render});
$("addBtn").onclick=function(){editing="";cur=null;render()};
$("reset").onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}entries=(window.GRIMOIRE||[]).slice();cur=null;editing=null;render()};

var OWNER="Aomiwav",REPO="Aomi.github.io",TK="grimoire-jeton";
async function connect(t,silent){var m=$("pubmsg");m.textContent="Vérification…";
try{var r=await fetch("https://api.github.com/repos/"+OWNER+"/"+REPO,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}});
var j=r.ok?await r.json():null;
if(j&&j.permissions&&j.permissions.push){TOKEN=t;UNLOCKED=true;try{localStorage.setItem(TK,t)}catch(e){}
try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(Array.isArray(d))entries=d}catch(e){}
m.textContent="";cur=entries.length?sorted()[0].id:null;render();return}}catch(e){}
m.textContent=silent?"":"Connexion refusée. Vérifie le jeton."}
$("conn").onclick=function(){var t=$("tok").value.trim();if(t)connect(t,false)};
$("out").onclick=function(){UNLOCKED=false;TOKEN="";try{localStorage.removeItem(TK)}catch(e){}$("tok").value="";entries=(window.GRIMOIRE||[]).slice();editing=null;cur=entries.length?sorted()[0].id:null;$("pubmsg").textContent="";render()};
if(EDIT){var st="";try{st=localStorage.getItem(TK)||""}catch(e){}if(st)connect(st,true)}
$("pub").onclick=async function(){
var t=TOKEN,m=$("pubmsg");if(!UNLOCKED||!t)return;
m.textContent="Publication en cours…";
var u="https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/data.js",H={Authorization:"Bearer "+t,Accept:"application/vnd.github+json"};
try{
var r=await fetch(u,{headers:H}),sha;
if(r.ok){sha=(await r.json()).sha}else if(r.status!==404){throw new Error(r.status)}
var body={message:"Mise à jour du grimoire",content:btoa(unescape(encodeURIComponent(dataText())))};
if(sha)body.sha=sha;
var w=await fetch(u,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify(body)});
if(!w.ok)throw new Error(w.status);
m.textContent="Publié. Le site se met à jour dans 1 à 2 minutes."
}catch(e){m.textContent="Échec ("+e.message+"). Vérifie le jeton et ses droits sur le dépôt."}
};
window.onhashchange=function(){location.reload()};
if(entries.length)cur=sorted()[0].id;
render();
</script>
